name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          AEFC40: ${{ secrets.AEFC40 }}
          BF45F4: ${{ secrets.BF45F4 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('AEFC40', '')
          sec_b = os.environ.get('BF45F4', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- d61f90ad8ffe6d8c66a4894a8f -->', sec_a)
          if sec_b:
              after = after.replace('<!-- eced928fabe15812f182 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
